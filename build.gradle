plugins {
    id 'java-library'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id("com.gradleup.shadow") version "9.4.2"
    id "xyz.wagyourtail.jvmdowngrader" version "1.3.6"
}

configurations {
    shade
    implementation.extendsFrom shade
}

java {
    withSourcesJar()
}

repositories {
    maven {
        url = "https://cursemaven.com"
    }
}

String umcVersion = "2.0.0"
if (!"release".equalsIgnoreCase(System.getProperty("target"))) {
    try {
        umcVersion += "-${(providers.exec { commandLine("git", "rev-parse", "--verify", "--short=7", "HEAD") }.standardOutput.asText.get() as String).substring(0, 7)}"
    } catch (Exception ignored) {
        umcVersion += "-unknown"
    }
}
version = "api-" + umcVersion
group = "cam72cam.universalmodcore" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
String archivesBaseName = "UniversalModCore"
base.archivesName = archivesBaseName

println("version: ${version}")

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
println("Java: ${providers.systemProperty("java.version").get()}, " +
        "JVM: ${providers.systemProperty("java.vm.version").get()} (${providers.systemProperty("java.vendor").get()}), " +
        "Arch: ${providers.systemProperty("os.arch").get()}")

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jvmdg {
    quiet = false
    downgradeTo = JavaVersion.VERSION_1_8
    multiReleaseOriginal = true
    shadeInlining = false
    dg(configurations.shade, false)
    //MR-JAR uses a Incremental Update-like strategy, so add versions here won't cause too much waste
    multiReleaseVersions = [
            JavaVersion.VERSION_1_8,  // 1.16 and below
            JavaVersion.VERSION_16,   // 1.17
            JavaVersion.VERSION_17,   // 1.18 - 1.20
            JavaVersion.VERSION_21,   // 1.21
            JavaVersion.VERSION_25    // 26.1 and beyond as well as modern 1.7.10/1.12.2
    ].toSet()
}

repositories {
    mavenCentral()
}

dependencies {
    api("org.ow2.asm:asm-debug-all:5.2")
    api("com.google.guava:guava:32.1.2-jre")
    api("com.google.code.gson:gson:2.8.9")

    annotationProcessor("org.ow2.asm:asm-debug-all:5.2")
    annotationProcessor("com.google.guava:guava:32.1.2-jre")
    annotationProcessor("com.google.code.gson:gson:2.8.9")

    shade("org.jspecify:jspecify:1.0.0")
    shade("at.yawk.lz4:lz4-java:1.10.2")
    shade("javax.vecmath:vecmath:1.5.2")
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

jar {
    archiveClassifier = 'slim'
}

tasks.named("shadowJar") {
    archiveClassifier = ''
    configurations = project.configurations.named('shade').map { [it] }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
}

assemble.dependsOn shadowJar

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifact sourcesJar
            artifactId = archivesBaseName
        }
    }
    repositories {
        maven {
            url = "sftp://teamopenindustry.cc:22/var/www/html/maven/"
            credentials {
                username = "mavenci"
                password = System.getenv("MAVENCI_PASS")
            }
        }
    }
}

tasks.register('showBuildInfo') {
    doLast {
        System.out.println("Build Uploaded to Maven at: ")
        System.out.println("https://teamopenindustry.cc/maven/cam72cam/universalmodcore/UniversalModCore/${version}/UniversalModCore-${version}.jar")
    }
}

publish.finalizedBy showBuildInfo

// IntelliJ no longer downloads javadocs and sources by default, this tells Gradle to force IntelliJ to do it.
idea.module { downloadJavadoc = downloadSources = true }

eclipse {
    // Eclipse no longer downloads javadocs and sources by default, this tells Gradle to force Eclipse to do it.
    classpath { downloadJavadoc = downloadSources = true }

    // NOTE: ForgeGradle 7 does not yet support Eclipse run configurations
    // Run everytime eclipse builds the code
    //autoBuildTasks genEclipseRuns
    // Run when importing the project
    //synchronizationTasks 'genEclipseRuns'
}
